name: CI and deploy
on:
  push:
  pull_request:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Test
      run: npm test
  update:
    name: Update
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
    - name: Run script on VPS
      uses: appleboy/ssh-action@v1.2.4
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        debug: true
        script_stop: true
        script: |
          source ~/.nvm/nvm.sh
          source ~/.profile
          source ~/.bashrc
          pm2 stop emerald
          bash ~/scripts/update-emerald.sh
          pm2 start ~/scripts/emerald.sh
